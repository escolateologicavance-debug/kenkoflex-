<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco - Kenkoflex</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0d3b66, #001e3d);
            color: #ffffff;
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            margin-top: 10px;
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #f4d35e;
            font-size: 1.8rem;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        #cidadeVendedor {
            color: #e0e0e0;
            font-size: 1.1rem;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* Imagem com Zoom Interativo */
        .image-box {
            width: 100%;
            max-height: 450px;
            overflow: hidden;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 2px solid rgba(244, 211, 94, 0.3);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .image-box:hover {
            transform: scale(1.01);
        }

        .image-box img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Janela de Zoom (Modal) */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
            cursor: zoom-out;
        }

        .modal img {
            max-width: 95%;
            max-height: 95vh;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
        }

        .contact-card {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .contact-card h2 {
            color: #f4d35e;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .contact-item {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #e0e0e0;
        }

        .contact-item a {
            color: #f4d35e;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }

        .contact-item a:hover {
            color: #e9c46a;
            text-decoration: underline;
        }

        .btn-container {
            margin-top: 30px;
        }

        .btn-back {
            display: inline-block;
            background-color: #f4d35e;
            color: #0d3b66;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(244, 211, 94, 0.4);
        }

        .btn-back:hover {
            transform: scale(1.05);
            background-color: #e9c46a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Fale Conosco</h1>
        <div id="cidadeVendedor">📍 Atendimento Exclusivo</div>

        <!-- Imagem Dinâmica -->
        <div class="image-box" onclick="abrirZoom(this)">
            <img id="imgPerfil" src="perfil-kenkoflex.png" alt="Kenkoflex">
        </div>

        <div class="contact-card">
            <h2>Entre em contato com o consultor:</h2>
            <div class="contact-item" id="tel1Container">
                📞 <a id="tel1Link" href="#">(66) 99939 -0173</a>
            </div>
            <div class="contact-item" id="tel2Container" style="display: none;">
                📞 <a id="tel2Link" href="#"></a>
            </div>
            <div class="contact-item" style="margin-top: 20px;">
                📸 Instagram: <br>
                <a id="instaLink" href="https://instagram.com/kenkoflexcolchoes" target="_blank">@kenkoflexcolchoes</a>
            </div>
            Desenvolvedor: Gilberto Moreira Itanhangá-MT 
            Brasil
            gilinbrazil@gmail.com 
        </div>

        <div class="btn-container">
            <a href="index.html" class="btn-back">← Voltar ao Início</a>
        </div>
    </div>

    <!-- Tela de Zoom -->
    <div id="zoomModal" class="modal" onclick="fecharZoom()">
        <img id="imgExpandida" src="" alt="Imagem Ampliada">
    </div>

    <script>
        // Lógica para ler os dados da URL do Vendedor
        const params = new URLSearchParams(window.location.search);
        
        const cidade = params.get('cidade');
        const tel1 = params.get('tel1');
        const tel2 = params.get('tel2');
        const insta = params.get('insta');
        const foto = params.get('foto');

        if (cidade) {
            document.getElementById('cidadeVendedor').innerText = "📍 Atendimento em " + decodeURIComponent(cidade);
        }

        if (tel1) {
            document.getElementById('tel1Link').href = "tel:" + tel1.replace(/\D/g,'');
            document.getElementById('tel1Link').innerText = tel1;
        }

        if (tel2) {
            document.getElementById('tel2Container').style.display = "block";
            document.getElementById('tel2Link').href = "tel:" + tel2.replace(/\D/g,'');
            document.getElementById('tel2Link').innerText = tel2;
        }

        if (insta) {
            let instaLimpo = insta.replace('@', '');
            document.getElementById('instaLink').href = "https://instagram.com/" + instaLimpo;
            document.getElementById('instaLink').innerText = "@" + instaLimpo;
        }

        if (foto) {
            document.getElementById('imgPerfil').src = foto;
        }

        // Funções de Zoom
        function abrirZoom(elemento) {
            var modal = document.getElementById("zoomModal");
            var imgModal = document.getElementById("imgExpandida");
            var imgOriginal = elemento.querySelector("img");
            modal.style.display = "flex";
            imgModal.src = imgOriginal.src;
        }

        function fecharZoom() {
            document.getElementById("zoomModal").style.display = "none";
        }
    </script>

</body>
</html>
