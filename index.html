<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenkoflex - Colchão Terapêutico</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d3b66">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0d3b66, #001e3d);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #globe-container {
            width: 200px;
            height: 200px;
            cursor: grab;
            filter: drop-shadow(0px 10px 25px rgba(0, 0, 0, 0.6));
            margin-top: 10px;
        }

        #globe-container:active {
            cursor: grabbing;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.3;
            color: #f4d35e;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            text-align: center;
            padding: 0 10px;
            margin-bottom: 10px;
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            width: 100%;
            padding: 0 10px 20px 10px;
        }

        .topic-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .topic-card:hover {
            background-color: #f4d35e;
            color: #0d3b66;
            transform: translateY(-3px);
            border-color: #f4d35e;
            box-shadow: 0 6px 15px rgba(244, 211, 94, 0.3);
        }
    </style>
    <!-- Three.js para renderização 3D do globo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="container">
        <!-- Contêiner do Globo 3D rotativo -->
        <div id="globe-container"></div>

        <h1>Por que você vai Escolher o Colchão kenkoflex?!</h1>
        
        <div class="topics-grid">
            <a href="1.html" class="topic-card">1. Alívio de Dores</a>
            <a href="2.html" class="topic-card">2. Sono Profundo</a>
            <a href="3.html" class="topic-card">3. Melhora da Saúde</a>
            <a href="4.html" class="topic-card">4. Alívio de Pressões</a>
            <a href="5.html" class="topic-card">5. Mais Disposição</a>
            <a href="6.html" class="topic-card">6. Qualidade de Vida (15 Anos de Garantia)</a>
        </div>
    </div>

    <script>
        // Configuração do Cenario 3D com Three.js
        const container = document.getElementById('globe-container');
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 2.5;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Luzes ajustadas para realçar o brilho metálico/esférico do logotipo
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
        scene.add(ambientLight);

        const pointLight = new THREE.DirectionalLight(0xffffff, 1.2);
        pointLight.position.set(5, 3, 5);
        scene.add(pointLight);

        // Criação da Esfera (Globo) perfeita
        const geometry = new THREE.SphereGeometry(1, 64, 64);

        // Carregando a textura mapeada fiel ao logotipo original
        const textureLoader = new THREE.TextureLoader();
        // Caso prefira usar o arquivo local, garanta que watermarked_img_979393035786885296.png está no repositório.
        textureLoader.load('watermarked_img_979393035786885296.png', (texture) => {
            const material = new THREE.MeshStandardMaterial({ 
                map: texture,
                roughness: 0.3,
                metalness: 0.15
            });
            
            const globe = new THREE.Mesh(geometry, material);
            scene.add(globe);

            // Animação contínua de rotação sobre o próprio eixo
            function animate() {
                requestAnimationFrame(animate);
                globe.rotation.y += 0.006; // Velocidade suave e contínua
                renderer.render(scene, camera);
            }
            animate();
        }, undefined, (err) => {
            console.error('Erro ao carregar a textura do globo:', err);
        });

        // Responsividade ao redimensionar a tela
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Registro do Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado com sucesso!', reg))
                    .catch(err => console.log('Erro ao registrar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
